<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gradients for Circular Progress Gauges -->
    <linearGradient id="gradJs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" /><stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="gradReact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" /><stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="gradNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" /><stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="gradTailwind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /><stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="gradBackend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" /><stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="gradPython" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="gradHtml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" /><stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="gradGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" /><stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .gauge-track {
        stroke: #1e293b;
        stroke-width: 6;
      }
      .gauge-fill {
        stroke-width: 6;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s ease;
      }
      .gauge-pct {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 800;
        fill: #f8fafc;
        text-anchor: middle;
      }
      .gauge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        fill: #94a3b8;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- ==================== ROW 1 ==================== -->

  <!-- 1. JavaScript (95%) -->
  <g transform="translate(106, 58)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradJs)" stroke-dasharray="188.5" stroke-dashoffset="9.4" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">95%</text>
    <text x="0" y="48" class="gauge-label">JavaScript</text>
  </g>

  <!-- 2. React.js (90%) -->
  <g transform="translate(318, 58)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradReact)" stroke-dasharray="188.5" stroke-dashoffset="18.8" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">90%</text>
    <text x="0" y="48" class="gauge-label">React.js</text>
  </g>

  <!-- 3. Next.js (85%) -->
  <g transform="translate(530, 58)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradNext)" stroke-dasharray="188.5" stroke-dashoffset="28.3" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">85%</text>
    <text x="0" y="48" class="gauge-label">Next.js</text>
  </g>

  <!-- 4. Tailwind CSS (95%) -->
  <g transform="translate(742, 58)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradTailwind)" stroke-dasharray="188.5" stroke-dashoffset="9.4" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">95%</text>
    <text x="0" y="48" class="gauge-label">Tailwind CSS</text>
  </g>

  <!-- ==================== ROW 2 ==================== -->

  <!-- 5. Firebase & Supabase (88%) -->
  <g transform="translate(106, 172)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradBackend)" stroke-dasharray="188.5" stroke-dashoffset="22.6" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">88%</text>
    <text x="0" y="48" class="gauge-label">Cloud / Supabase</text>
  </g>

  <!-- 6. Node.js & Python (82%) -->
  <g transform="translate(318, 172)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradPython)" stroke-dasharray="188.5" stroke-dashoffset="33.9" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">82%</text>
    <text x="0" y="48" class="gauge-label">Node.js / Python</text>
  </g>

  <!-- 7. HTML5 & CSS3 (98%) -->
  <g transform="translate(530, 172)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradHtml)" stroke-dasharray="188.5" stroke-dashoffset="3.8" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">98%</text>
    <text x="0" y="48" class="gauge-label">HTML5 / CSS3</text>
  </g>

  <!-- 8. Git & Deployment (92%) -->
  <g transform="translate(742, 172)">
    <circle cx="0" cy="0" r="30" class="gauge-track" />
    <circle cx="0" cy="0" r="30" class="gauge-fill" stroke="url(#gradGit)" stroke-dasharray="188.5" stroke-dashoffset="15.1" transform="rotate(-90)" filter="url(#softGlow)" />
    <text x="0" y="5" class="gauge-pct">92%</text>
    <text x="0" y="48" class="gauge-label">Git / Cloud Deploy</text>
  </g>
</svg>
