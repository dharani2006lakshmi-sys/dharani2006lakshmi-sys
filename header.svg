<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #38bdf8; #c084fc; #818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #c084fc; #818cf8; #38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #818cf8; #38bdf8; #c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: 1.5px;
      }
      .sub-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-weight: 500;
        font-size: 15px;
        fill: #94a3b8;
        letter-spacing: 2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .pulse-circle {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
    </style>
  </defs>

  <!-- Card Background with Neon Border -->
  <rect x="2" y="2" width="846" height="196" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="80" cy="50" r="60" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="150" r="70" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Accents -->
  <path d="M 40 40 L 80 40 M 40 40 L 40 80" stroke="#6366f1" stroke-width="1.5" opacity="0.4" />
  <path d="M 810 160 L 770 160 M 810 160 L 810 120" stroke="#06b6d4" stroke-width="1.5" opacity="0.4" />

  <!-- Status Pill -->
  <g transform="translate(425, 42)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="-116" cy="0" r="4.5" fill="#22c55e" class="pulse-circle" />
    <text x="-102" y="4" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN FOR FREELANCE &amp; ROLES</text>
  </g>

  <!-- Main Headline -->
  <text x="425" y="106" text-anchor="middle" class="title-text" fill="url(#textGrad)" filter="url(#glow)">
    DHARANIDHARAN A
  </text>

  <!-- Dynamic Subtitle -->
  <text x="425" y="138" text-anchor="middle" class="sub-text">
    &lt;Freelance Web Developer /&gt; • 3rd-Year ECE Undergrad
  </text>

  <!-- Mini Tech Stack Pills -->
  <g transform="translate(425, 172)">
    <!-- Pill 1 -->
    <rect x="-210" y="-12" width="90" height="22" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="-165" y="3" text-anchor="middle" class="tag-text" fill="#61dafb">⚛ REACT</text>

    <!-- Pill 2 -->
    <rect x="-105" y="-12" width="95" height="22" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="-57" y="3" text-anchor="middle" class="tag-text" fill="#ffffff">▲ NEXT.JS</text>

    <!-- Pill 3 -->
    <rect x="5" y="-12" width="100" height="22" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="55" y="3" text-anchor="middle" class="tag-text" fill="#38bdf8">🎨 TAILWIND</text>

    <!-- Pill 4 -->
    <rect x="120" y="-12" width="105" height="22" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="172" y="3" text-anchor="middle" class="tag-text" fill="#34d399">⚡ SUPABASE</text>
  </g>
</svg>
